<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hecho Pa' Ti</title>
<meta name="description" content="Detalles personalizados y básicos del hogar para la familia mexicana en EE. UU. Personalized keepsakes and everyday basics for Mexican families in the U.S. 面向美国墨西哥裔家庭的个性化纪念品。">
<meta property="og:title" content="Hecho Pa' Ti">
<meta property="og:description" content="Diseñado por mexicanos, con tu nombre. Llaveros, imanes, recuerdos de quince, cocina y más.">
<meta name="theme-color" content="#d4246b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="papel"></div>
<header class="bar"><div class="wrap">
  <a class="brand" href="#top" aria-label="Hecho Pa' Ti">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#d4246b"/><path d="M24 36c-6-4-12-9-12-15a6 6 0 0 1 11-3.5A6 6 0 0 1 36 21c0 6-6 11-12 15z" fill="#fbf7ee"/><path d="M19 20.5c1.2-2 3.8-2.2 5-.3 1.2-1.9 3.8-1.7 5 .3" fill="none" stroke="#d4246b" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span><span class="name">Hecho Pa' Ti</span><small data-i="tag">Diseñado por mexicanos, con tu nombre</small></span>
  </a>
  <div class="spacer"></div>
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" data-p="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar"></label>
  <div class="lang" role="group" aria-label="Idioma / Language"><button id="es" aria-pressed="true">ES</button><button id="en" aria-pressed="false">EN</button><button id="zh" aria-pressed="false">中文</button></div>
  <button class="cartbtn" id="opencart" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i="cart">Carrito</span><b id="count">0</b></button>
</div></header>

<section class="hero" id="top"><div class="wrap">
  <h1 data-i="h1">Hecho pa' tu casa, tu carro y tu <em>fiesta</em>.</h1>
  <p data-i="sub"></p>
  <div class="trust"><span data-i="trust1"></span><span data-i="trust2"></span><span data-i="trust3"></span><span data-i="trust4"></span></div>
  <div class="herorow">
    <label class="state"><span data-i="stateq"></span><select id="state"></select></label>
    <a class="btn wa small" id="share" href="#" target="_blank" rel="noopener" data-i="share"></a>
  </div>
</div></section>
<section class="season" id="season" hidden><div class="wrap"><strong data-i="seasonh"></strong><div id="seasonlist"></div></div></section>

<nav class="cats" aria-label="Categorías"><div class="wrap" id="catnav"></div></nav>
<div class="msearch wrap"><input id="qm" type="search" data-p="search" placeholder="Buscar…" autocomplete="off" aria-label="Buscar"></div>

<section class="how"><div class="wrap">
  <div class="steps">
    <div class="step"><b>1</b><h3 data-i="how1"></h3><p data-i="how1p"></p></div>
    <div class="step"><b>2</b><h3 data-i="how2"></h3><p data-i="how2p"></p></div>
    <div class="step"><b>3</b><h3 data-i="how3"></h3><p data-i="how3p"></p></div>
  </div>
</div></section>

<main id="main"></main>

<section class="taller" id="taller"><div class="wrap">
  <div class="tallerbox">
    <div><h2 data-i="tallerh"></h2><p data-i="tallerp"></p></div>
    <ul><li data-i="ta"></li><li data-i="tb"></li><li data-i="tc"></li><li data-i="td"></li></ul>
  </div>
</div></section>

<section class="wish" id="pedido"><div class="wrap">
  <div class="wishbox">
    <h2 data-i="wish"></h2>
    <p data-i="wishp"></p>
    <form id="wishform" novalidate>
      <textarea id="wdesc" data-p="wdesc" maxlength="200" rows="2" required></textarea>
      <input id="wlink" data-p="wlink" type="url" inputmode="url" autocomplete="off">
      <div class="two"><input id="wqty" data-p="wqty" type="number" min="1" inputmode="numeric"><input id="wemail" data-p="email" type="email" autocomplete="email" required></div>
      <div class="two"><input id="wname" data-p="name" autocomplete="name"><input id="wphone" data-p="phone" inputmode="tel" autocomplete="tel"></div>
      <textarea id="wnote" rows="2" data-p="wnote"></textarea>
      <div class="acts"><button class="btn" type="submit" data-i="wsend"></button><button class="btn ghost" type="button" id="wwa">WhatsApp</button></div>
      <p class="wdone" id="wdone" hidden data-i="wsent"></p>
    </form>
  </div>
</div></section>

<section class="faq" id="faq"><div class="wrap">
  <h2 data-i="faq"></h2>
  <details><summary data-i="q1"></summary><p data-i="a1"></p></details>
  <details><summary data-i="q2"></summary><p data-i="a2"></p></details>
  <details><summary data-i="q3"></summary><p data-i="a3"></p></details>
  <details><summary data-i="q4"></summary><p data-i="a4"></p></details>
  <details><summary data-i="q5"></summary><p data-i="a5"></p></details>
</div></section>

<footer><div class="wrap">
  <div><strong>Hecho Pa' Ti</strong> · <span data-i="foot1"></span></div>
  <div data-i="foot2"></div>
  <div data-i="tax"></div>
  <div data-i="foot3"></div>
  <div class="social" id="social"></div>
</div></footer>

<button class="cartbar" id="cartbar" type="button" aria-haspopup="dialog" hidden><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i="cart">Carrito</span><b id="barcount">0</b></span><span id="bartotal">$0</span></button>

<div id="cartroot" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="carttitle">
    <header><h2 id="carttitle" data-i="cart">Carrito</h2><button class="x" id="closecart" aria-label="Cerrar / Close">×</button></header>
    <div class="lines" id="lines"></div>
    <form class="checkout" id="form">
      <div class="notice"><strong data-i="preh"></strong><p data-i="apart"></p><p data-i="prep"></p><p class="small" data-i="nochange"></p></div>
      <div class="sumrow"><span data-i="subtotal"></span><span id="subtotal">$0</span></div>
      <div class="sumrow" id="shiprow"><span data-i="shipping"></span><span id="ship">$0</span></div>
      <div class="total"><span data-i="total">Total</span><span id="total">$0</span></div>
      <div class="deposit"><span data-i="deposit"></span><span id="deposit">$0</span></div>
      <div class="sumrow"><span data-i="rest"></span><span id="rest">$0</span></div>
      <div class="two"><input id="name" data-p="name" autocomplete="name" required><input id="phone" data-p="phone" inputmode="tel" autocomplete="tel" required></div>
      <input id="email" data-p="email" type="email" autocomplete="email" required>
      <div class="opts" id="deliver" role="radiogroup">
        <label><input type="radio" name="dl" value="pickup" checked><span data-i="pickup"></span></label>
        <label><input type="radio" name="dl" value="mail"><span data-i="mailit"></span></label>
      </div>
      <input id="city" data-p="city" autocomplete="address-level2">
      <select id="pay"><option value="Zelle">Zelle</option><option value="Cash App">Cash App</option><option value="Efectivo / Cash" data-i="cash"></option><option value="Tarjeta / Card" data-i="cardopt"></option></select>
      <textarea id="note" rows="2" data-p="note"></textarea>
      <button class="btn wa" type="submit" data-i="send"></button>
      <div class="acts"><button class="btn ghost" type="button" id="mail" data-i="mail"></button><button class="btn ghost" type="button" id="copy" data-i="copy"></button></div>
      <div class="wa-line"><span data-i="orwa"></span><code id="wadisplay"></code></div>
      <p class="small muted" data-i="tax"></p>
    </form>
    <div class="done" id="done" hidden>
      <h3 data-i="sent"></h3>
      <p id="donep"></p>
      <p class="meta" data-i="sentwa"></p>
      <div class="acts"><button class="btn ghost" type="button" id="copy2" data-i="copy"></button><button class="btn" type="button" id="again" data-i="again"></button></div>
    </div>
  </aside>
</div>

<div id="pmroot" hidden>
  <div class="scrim" id="pmscrim"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pmtitle">
    <button class="x" id="pmclose" aria-label="Cerrar / Close">×</button>
    <div class="pmgrid">
      <div class="pmimg" id="pmimg"></div>
      <div class="pmbody">
        <span class="pmtag" id="pmtag"></span>
        <h3 id="pmtitle"></h3>
        <p id="pmdesc"></p>
        <dl class="specs" id="pmspecs"></dl>
        <details class="howmade" id="pmhow"><summary data-i="howmade"></summary><ol id="pmsteps"></ol></details>
        <form id="pmform">
          <select id="pmvariant" hidden></select>
          <input id="pmperso" maxlength="60" hidden>
          <div class="pmrow">
            <label class="qty"><span data-i="qty"></span><input id="pmqty" type="number" min="1" value="1" inputmode="numeric"></label>
            <span class="price" id="pmprice"></span>
          </div>
          <button class="btn" type="submit" data-i="addq"></button>
          <p class="small muted" id="pmmin"></p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/specs.js"></script>
<script src="js/i18n.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
</body>
</html>
